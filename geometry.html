<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TubeBEND - Continuous Ovality Lab</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; margin: 0; padding: 20px; overflow: hidden; }
        .header-controls { display: flex; align-items: center; gap: 20px; background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px); }
        .panel { background: #151515; border-radius: 10px; padding: 20px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; }
        #viewer3d { flex-grow: 1; background: #000; border-radius: 5px; cursor: crosshair; }
        #hoverInfo { font-family: 'Consolas', monospace; color: white; margin-bottom: 10px; font-size: 14px; min-height: 1.5em; border-bottom: 1px solid #333; }
        h2 { margin: 0 0 10px 0; font-size: 12px; color: #00a896; text-transform: uppercase; }
        button { background: #00a896; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        input { background: #222; color: white; border: 1px solid #444; padding: 8px; border-radius: 5px; width: 65px; }
    </style>
</head>
<body>

<div class="header-controls">
    <label><b>PROCESS ID:</b></label>
    <input type="number" id="prcInput" min="1" max="318">
    <button id="goBtn">Analyze Process</button>
    <div id="statusLabel" style="margin-left: auto; color: #00a896; font-weight: bold;"></div>
</div>

<div class="dashboard-grid">
    <div class="panel">
        <h2>3D Reconstruction</h2>
        <div id="viewer3d"></div>
    </div>
    <div class="panel">
        <div id="hoverInfo">Hover over graph to inspect metrics</div>
        <div id="plot"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    let currentId = params.get("prc") || "79";
    document.getElementById("prcInput").value = currentId;

    let globalCurve; 
    let highlightRing; 
    let totalPointsCount = 0;

    let combinedMainAxis = [];
    let combinedSecondaryAxis = [];

    function normalize(arr) {
        const min = Math.min(...arr), max = Math.max(...arr);
        return (max - min === 0) ? arr.map(() => 0) : arr.map(v => (v - min) / (max - min));
    }

    function startAnalysis(id) {
        const script = document.createElement("script");
        script.src = `website_data/geometry_data/geo${id}.js`;
        script.onload = () => {
            combinedMainAxis = [...geo_linear_1.main_axis, ...geo_arc.main_axis, ...geo_linear_2.main_axis];
            combinedSecondaryAxis = [...geo_linear_1.secondary_axis, ...geo_arc.secondary_axis, ...geo_linear_2.secondary_axis];
            totalPointsCount = combinedMainAxis.length;

            init3D();
            initPlot(); 
        };
        document.head.appendChild(script);
    }

    function init3D() {
        const container = document.getElementById("viewer3d");
        container.innerHTML = "";
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 1.4));
        scene.add(new THREE.GridHelper(1000, 50, 0x444444, 0x222222));

        const baseRadius = window.tube_radius || 11.0;
        const bendR = 40; 
        const L1 = geo_linear_1.x[geo_linear_1.x.length - 1];
        const ArcL = geo_arc.x[geo_arc.x.length - 1];
        const L2 = geo_linear_2.x[geo_linear_2.x.length - 1];
        const angleRad = ArcL / bendR;
        
        document.getElementById("statusLabel").textContent = `EXP_${currentId} | Angle: ${(angleRad * 180 / Math.PI).toFixed(1)}°`;

        const pathPoints = [];
        pathPoints.push(new THREE.Vector3(0, baseRadius, 0));
        pathPoints.push(new THREE.Vector3(L1, baseRadius, 0));
        
        const arcSteps = geo_arc.x.length;
        for(let i=0; i < arcSteps; i++) {
            const r = (geo_arc.x[i] / ArcL) * angleRad;
            pathPoints.push(new THREE.Vector3(L1 + bendR * Math.sin(r), baseRadius, -bendR + bendR * Math.cos(r)));
        }
        const lastArc = pathPoints[pathPoints.length - 1];
        pathPoints.push(new THREE.Vector3(lastArc.x + L2 * Math.cos(angleRad), baseRadius, lastArc.z - L2 * Math.sin(angleRad)));

        globalCurve = new THREE.CatmullRomCurve3(pathPoints);

        // Create one single unified tube mesh piece
        const tubeSegments = 120; 
        const radialSegments = 32;
        const tubeGeom = new THREE.TubeGeometry(globalCurve, tubeSegments, baseRadius, radialSegments, false);
        
        // Deform vertices of unified piece directly to match physical measurements
        const posAttribute = tubeGeom.attributes.position;
        const normalsAttribute = tubeGeom.attributes.normal;
        
        for (let i = 0; i < posAttribute.count; i++) {
            // Find which segment step along length this vertex belongs to
            const segmentIndex = Math.floor(i / (radialSegments + 1));
            const pct = segmentIndex / tubeSegments;
            const dataIndex = Math.min(Math.floor(pct * totalPointsCount), totalPointsCount - 1);

            // Calculate scaling factors relative to nominal diameter
            const scaleX = combinedSecondaryAxis[dataIndex] / (baseRadius * 2);
            const scaleY = combinedMainAxis[dataIndex] / (baseRadius * 2);

            // Get normal vector to deform outward elliptically from centerline
            let nx = normalsAttribute.getX(i);
            let ny = normalsAttribute.getY(i);

            let vx = posAttribute.getX(i);
            let vy = posAttribute.getY(i);

            // Apply direct coordinate adjustment to unified wall geometry
            posAttribute.setX(i, vx + (scaleX - 1) * nx * baseRadius);
            posAttribute.setY(i, vy + (scaleY - 1) * ny * baseRadius);
        }
        
        tubeGeom.computeVertexNormals();

        const tubeMat = new THREE.MeshPhongMaterial({ 
            color: 0x00ffcc, 
            transparent: true, 
            opacity: 0.4, 
            side: THREE.DoubleSide
        });
        const tubeMesh = new THREE.Mesh(tubeGeom, tubeMat);
        scene.add(tubeMesh);

        // High visibility clean wireframe skin
        const wireframe = new THREE.LineSegments(
            new THREE.WireframeGeometry(tubeGeom),
            new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.15 })
        );
        tubeMesh.add(wireframe);

        // Interactive tracking indicator circle
        const trackerGeom = new THREE.TorusGeometry(baseRadius + 0.3, 0.4, 8, 32);
        const trackerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        highlightRing = new THREE.Mesh(trackerGeom, trackerMat);
        highlightRing.visible = false; 
        scene.add(highlightRing);

        camera.position.set(L1 + 350, 350, 350);
        controls.target.set(L1, 0, -bendR);
        controls.update();

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    }

    function initPlot() {
        const target = document.getElementById("plot");
        target.innerHTML = "";
        const comb = { x: [], sec: [], main: [], oor: [], col: [], labs: [] };
        let count = 0;
        
        [geo_linear_1, geo_arc, geo_linear_2].forEach(s => {
            s.x.forEach((v, i) => {
                comb.x.push(count++);
                comb.sec.push(s.secondary_axis[i] || 0);
                comb.main.push(s.main_axis[i] || 0);
                comb.oor.push(s.out_of_roundness[i] || 0);
                comb.col.push(s.collapse[i] || 0);
                comb.labs.push(s.section_name);
            });
        });

        new uPlot({
            width: target.clientWidth, height: 500,
            scales: { x: { time: false }, y: { range: [0, 1.1] } },
            axes: [{ label: "Path Index", stroke: "#fff" }, { label: "Normalized Value", stroke: "#fff" }],
            series: [
                {}, 
                { label: "Secondary", stroke: "red", width: 2 }, 
                { label: "Main Axis", stroke: "blue", width: 2 }, 
                { label: "Out of Roundness", stroke: "green", width: 2 }, 
                { 
                    label: "Collapse", 
                    stroke: "purple", 
                    width: 2,
                    // Add a dash pattern so the underlying blue line is visible
                    dash: [8, 5] 
                }
            ],
            hooks: {
                setCursor: [u => {
                    const i = u.cursor.idx;
                    if (i == null || !globalCurve || !highlightRing) {
                        if (highlightRing) highlightRing.visible = false;
                        return;
                    }
                    
                    document.getElementById("hoverInfo").innerHTML = `<b>${comb.labs[i]}</b> | Secondary: ${comb.sec[i].toFixed(2)} | Main Axis: ${comb.main[i].toFixed(2)} | Out of Roundness: ${comb.oor[i].toFixed(4)} | Collapse: ${comb.col[i].toFixed(3)}`;
                    
                    highlightRing.visible = true;
                    const progress = i / (totalPointsCount - 1);
                    const position = globalCurve.getPointAt(progress);
                    const tangent = globalCurve.getTangentAt(progress);
                    
                    highlightRing.position.copy(position);
                    highlightRing.lookAt(position.clone().add(tangent));

                    const scaleX = combinedSecondaryAxis[i] / (11.0 * 2);
                    const scaleY = combinedMainAxis[i] / (11.0 * 2);
                    highlightRing.scale.set(scaleX, scaleY, 1.0);
                }]
            }
        }, [comb.x, normalize(comb.sec), normalize(comb.main), normalize(comb.oor), normalize(comb.col)], target);
    }

    document.getElementById("goBtn").onclick = () => window.location.href = `geometry.html?prc=${document.getElementById("prcInput").value}`;
    startAnalysis(currentId);
</script>
</body>
</html>
