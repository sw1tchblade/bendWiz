<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TubeBEND - True Data Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; margin: 0; padding: 20px; overflow: hidden; }
        .header-controls { display: flex; align-items: center; gap: 20px; background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: calc(100vh - 120px); width: 100%; }
        .panel { background: #151515; border-radius: 10px; padding: 20px; border: 1px solid #2a2a2a; display: flex; flex-direction: column; min-width: 0; }
        #viewer3d { flex-grow: 1; background: #000; border-radius: 5px; cursor: crosshair; }
        #hoverInfo { font-family: 'Consolas', monospace; color: white; margin-bottom: 10px; font-size: 14px; min-height: 1.5em; border-bottom: 1px solid #333; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h2 { margin: 0; font-size: 12px; color: #00a896; text-transform: uppercase; }
        button { background: #00a896; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; font-weight: 600; }
        .toggle-btn { background: #333; font-size: 11px; padding: 4px 10px; }
        .toggle-btn:hover { background: #444; }
        input[type="number"] { background: #222; color: white; border: 1px solid #444; padding: 8px; border-radius: 5px; width: 65px; }
    </style>
</head>
<body>

<div class="header-controls">
    <label><b>PROCESS ID:</b></label>
    <input type="number" id="prcInput" min="1" max="318">
    <button id="goBtn">Analyze Process</button>
    <div id="statusLabel" style="margin-left: auto; color: #00a896; font-weight: bold;"></div>
</div>

<div class="dashboard-grid">
    <div class="panel">
        <div class="panel-header">
            <h2>3D True Data Construction</h2>
            <button class="toggle-btn" id="opacityBtn">Make Opaque</button>
        </div>
        <div id="viewer3d"></div>
    </div>
    <div class="panel">
        <div id="hoverInfo">Hover over graph to inspect metrics</div>
        <div id="plot"></div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    let currentId = params.get("prc") || "79";
    document.getElementById("prcInput").value = currentId;

    let highlightRing, tubeMaterial;
    let camera, renderer, scene, plotInstance, controls;

    let meshMainAxis = [];
    let meshSecAxis = [];
    let meshCollapse = [];
    let N1 = 0, N2 = 0, N3 = 0, totalPointsCount = 0;
    
    let globalShiftX = 0;
    let globalShiftZ = 0;
    
    let cleanPathX = [];
    let cleanPathY = [];
    let cleanPathZ = [];

    function normalize(arr) {
        const min = Math.min(...arr), max = Math.max(...arr);
        return (max - min === 0) ? arr.map(() => 0) : arr.map(v => (v - min) / (max - min));
    }

    // Averages out duplicate overlapping points to avert Gimbal lock tearing
    function getSmoothTangent(s, pathX, pathY, pathZ, total) {
        const center = new THREE.Vector3(pathX[s], pathY[s], pathZ[s]);
        
        let nxtIdx = s + 1;
        let pNxt = null;
        while(nxtIdx < total) {
            const temp = new THREE.Vector3(pathX[nxtIdx], pathY[nxtIdx], pathZ[nxtIdx]);
            if (temp.distanceToSquared(center) > 0.001) { pNxt = temp; break; }
            nxtIdx++;
        }
        
        let prvIdx = s - 1;
        let pPrv = null;
        while(prvIdx >= 0) {
            const temp = new THREE.Vector3(pathX[prvIdx], pathY[prvIdx], pathZ[prvIdx]);
            if (temp.distanceToSquared(center) > 0.001) { pPrv = temp; break; }
            prvIdx--;
        }

        let tangent = new THREE.Vector3();
        if (pNxt && pPrv) {
            tangent.subVectors(pNxt, pPrv).normalize();
        } else if (pNxt) {
            tangent.subVectors(pNxt, center).normalize();
        } else if (pPrv) {
            tangent.subVectors(center, pPrv).normalize();
        } else {
            tangent.set(1, 0, 0);
        }
        return tangent;
    }

    function startAnalysis(id) {
        const script = document.createElement("script");
        script.src = `website_data/geometry_data/geo${id}.js`;
        script.onload = () => {
            N1 = geo_linear_1.x.length;
            N2 = geo_arc.x.length;
            N3 = geo_linear_2.x.length;
            
            // L1 arrays are firmly reversed. The stress from the bend now maps correctly to the bend coordinate.
            const l1_main_rev = [...geo_linear_1.main_axis].reverse();
            const l1_sec_rev = [...geo_linear_1.secondary_axis].reverse();
            const l1_col_rev = [...geo_linear_1.collapse].reverse();

            meshMainAxis = [...l1_main_rev, ...geo_arc.main_axis, ...geo_linear_2.main_axis];
            meshSecAxis = [...l1_sec_rev, ...geo_arc.secondary_axis, ...geo_linear_2.secondary_axis];
            meshCollapse = [...l1_col_rev, ...geo_arc.collapse, ...geo_linear_2.collapse];
            totalPointsCount = meshMainAxis.length;

            if (N2 > 0 && window.tube_path_3d) {
                const arcMidIdx = N1 + Math.floor(N2 / 2);
                globalShiftX = -window.tube_path_3d.x[arcMidIdx];
                globalShiftZ = -window.tube_path_3d.z[arcMidIdx];
            }

            const displayAngle = window.bend_angle_deg !== undefined ? window.bend_angle_deg : 45.0;
            document.getElementById("statusLabel").textContent = `EXP_${currentId} | Angle: ${displayAngle.toFixed(2)}°`;

            setTimeout(() => {
                init3D();
                initPlot();
            }, 30);
        };
        document.head.appendChild(script);
    }

    function toggleOpacity() {
        if (!tubeMaterial) return;
        const btn = document.getElementById("opacityBtn");
        if (tubeMaterial.transparent) {
            tubeMaterial.transparent = false;
            tubeMaterial.opacity = 1.0;
            btn.textContent = "Make Translucent";
        } else {
            tubeMaterial.transparent = true;
            tubeMaterial.opacity = 0.75;
            btn.textContent = "Make Opaque";
        }
        tubeMaterial.needsUpdate = true;
    }

    function init3D() {
        const container = document.getElementById("viewer3d");
        container.innerHTML = "";
        scene = new THREE.Scene();
        
        camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 5000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(200, 400, 300);
        scene.add(dirLight);

        const baseRadius = window.cross_section_radius || 11.0;
        
        const floorGrid = new THREE.GridHelper(1000, 50, 0x333333, 0x222222);
        floorGrid.position.y = -baseRadius - 1.0; 
        scene.add(floorGrid);

        cleanPathX = window.tube_path_3d.x.map(x => x + globalShiftX);
        cleanPathY = window.tube_path_3d.y.slice(); 
        cleanPathZ = window.tube_path_3d.z.map(z => z + globalShiftZ);

        // Deduplication to prevent overlapping vertices at index boundaries
        for (let i = 1; i < totalPointsCount - 1; i++) {
            const distSq = Math.pow(cleanPathX[i] - cleanPathX[i-1], 2) + 
                           Math.pow(cleanPathY[i] - cleanPathY[i-1], 2) + 
                           Math.pow(cleanPathZ[i] - cleanPathZ[i-1], 2);
            
            if (distSq < 0.001) {
                cleanPathX[i] = (cleanPathX[i-1] + cleanPathX[i+1]) / 2.0;
                cleanPathY[i] = (cleanPathY[i-1] + cleanPathY[i+1]) / 2.0;
                cleanPathZ[i] = (cleanPathZ[i-1] + cleanPathZ[i+1]) / 2.0;
            }
        }

        const radialSegments = 72;
        const geometry = new THREE.BufferGeometry();
        const vertexCount = totalPointsCount * (radialSegments + 1);
        const positions = new Float32Array(vertexCount * 3);
        const colors = new Float32Array(vertexCount * 3);
        const indices = [];

        const baseColor = new THREE.Color(0x00a896); 
        const deformColor = new THREE.Color(0xff3344); 

        for (let s = 0; s < totalPointsCount; s++) {
            const center = new THREE.Vector3(cleanPathX[s], cleanPathY[s], cleanPathZ[s]);

            let tangent = getSmoothTangent(s, cleanPathX, cleanPathY, cleanPathZ, totalPointsCount);

            let r_vec = new THREE.Vector3(0, 1, 0);
            if (Math.abs(tangent.dot(r_vec)) > 0.9) r_vec.set(1, 0, 0);
            const normalX = new THREE.Vector3().crossVectors(tangent, r_vec).normalize();
            const normalY = new THREE.Vector3().crossVectors(tangent, normalX).normalize();

            const isArc = (s >= N1 && s < N1 + N2);

            let m_val = meshMainAxis[s];
            if (m_val == null || isNaN(m_val)) m_val = baseRadius * 2;
            let s_val = meshSecAxis[s];
            if (s_val == null || isNaN(s_val)) s_val = baseRadius * 2;
            let c_val = meshCollapse[s];
            if (c_val == null || isNaN(c_val)) c_val = 0.0;

            const radiusX = s_val / 2.0; 
            const radiusY = m_val / 2.0;

            const offsetX = baseRadius - radiusX;
            const adjustedCenterX = center.x + (normalX.x * offsetX);
            const adjustedCenterY = center.y + (normalX.y * offsetX);
            const adjustedCenterZ = center.z + (normalX.z * offsetX);

            for (let r = 0; r <= radialSegments; r++) {
                const theta = (r / radialSegments) * Math.PI * 2;
                
                let collapseDeform = 0;
                let innerMask = 0;

                // Wrinkles are strictly applied ONLY to the arc section. Straight legs remain perfectly flush.
                if (isArc) {
                    innerMask = Math.pow(Math.max(0, -Math.cos(theta)), 3); 
                    collapseDeform = innerMask * Math.abs(c_val);
                }
                
                const currentRadX = Math.max(0.1, radiusX - collapseDeform);
                const currentRadY = Math.max(0.1, radiusY - collapseDeform); 

                const posX = adjustedCenterX + (currentRadX * Math.cos(theta) * normalX.x) + (currentRadY * Math.sin(theta) * normalY.x);
                const posY = adjustedCenterY + (currentRadX * Math.cos(theta) * normalX.y) + (currentRadY * Math.sin(theta) * normalY.y);
                const posZ = adjustedCenterZ + (currentRadX * Math.cos(theta) * normalX.z) + (currentRadY * Math.sin(theta) * normalY.z);

                const vIdx = (s * (radialSegments + 1) + r) * 3;
                positions[vIdx] = posX;
                positions[vIdx + 1] = posY;
                positions[vIdx + 2] = posZ;

                const mixedColor = baseColor.clone();
                if (isArc && innerMask > 0) {
                    const deformIntensity = Math.min(Math.abs(c_val) / (baseRadius * 0.05), 1.0);
                    mixedColor.lerp(deformColor, deformIntensity * innerMask);
                }
                
                colors[vIdx] = mixedColor.r;
                colors[vIdx + 1] = mixedColor.g;
                colors[vIdx + 2] = mixedColor.b;
            }
        }

        for (let s = 0; s < totalPointsCount - 1; s++) {
            for (let r = 0; r < radialSegments; r++) {
                const p0 = s * (radialSegments + 1) + r;
                const p1 = p0 + 1;
                const p2 = (s + 1) * (radialSegments + 1) + r;
                const p3 = p2 + 1;
                indices.push(p0, p1, p2);
                indices.push(p1, p3, p2);
            }
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();

        tubeMaterial = new THREE.MeshStandardMaterial({ 
            vertexColors: true, 
            metalness: 0.4,
            roughness: 0.4,
            transparent: true, 
            opacity: 0.75, 
            side: THREE.DoubleSide
        });
        
        const tubeMesh = new THREE.Mesh(geometry, tubeMaterial);
        scene.add(tubeMesh);

        const wireframe = new THREE.LineSegments(
            new THREE.WireframeGeometry(geometry),
            new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.05 })
        );
        tubeMesh.add(wireframe);

        const trackerGeom = new THREE.TorusGeometry(baseRadius + 0.4, 0.5, 8, 32);
        const trackerMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        highlightRing = new THREE.Mesh(trackerGeom, trackerMat);
        highlightRing.visible = false; 
        scene.add(highlightRing);

        camera.position.set(0, 350, 0.1); 
        controls.target.set(0, 0, 0);
        controls.update();

        function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
        animate();
    }

    function initPlot() {
        const target = document.getElementById("plot");
        target.innerHTML = "";

        let count = 0;
        const comb = { x: [], sec: [], main: [], oor: [], col: [], labs: [] };
        
        // Graph arrays natively match the 3D arrays because both use the reversed L1 data.
        const l1_rev = {
            x: [...geo_linear_1.x].reverse(),
            secondary_axis: [...geo_linear_1.secondary_axis].reverse(),
            main_axis: [...geo_linear_1.main_axis].reverse(),
            out_of_roundness: [...geo_linear_1.out_of_roundness].reverse(),
            collapse: [...geo_linear_1.collapse].reverse(),
            section_name: geo_linear_1.section_name
        };

        const sections = [l1_rev, geo_arc, geo_linear_2];

        for (let s of sections) {
            const len = s.x.length;
            for (let i = 0; i < len; i++) {
                comb.x.push(count++);
                comb.sec.push(s.secondary_axis[i] !== undefined ? s.secondary_axis[i] : 0);
                comb.main.push(s.main_axis[i] !== undefined ? s.main_axis[i] : 0);
                comb.oor.push(s.out_of_roundness[i] !== undefined ? s.out_of_roundness[i] : 0);
                comb.col.push(s.collapse[i] !== undefined ? s.collapse[i] : 0);
                comb.labs.push(s.section_name);
            }
        }

        plotInstance = new uPlot({
            width: target.clientWidth, height: 500,
            scales: { x: { time: false }, y: { range: [0, 1.1] } },
            axes: [{ label: "Path Index", stroke: "#fff" }, { label: "Normalized Value", stroke: "#fff" }],
            series: [
                {}, 
                { label: "Secondary", stroke: "red", width: 2 }, 
                { label: "Main Axis", stroke: "blue", width: 2, dash: [5, 5] }, 
                { label: "Out of Roundness", stroke: "green", width: 2 }, 
                { label: "Collapse", stroke: "purple", width: 2, dash: [5, 5] }
            ],
            hooks: {
                setCursor: [u => {
                    const i = u.cursor.idx;
                    if (i == null || !highlightRing) {
                        if (highlightRing) highlightRing.visible = false;
                        return;
                    }

                    document.getElementById("hoverInfo").innerHTML = 
                        `<b>${comb.labs[i]}</b> | Secondary: ${comb.sec[i].toFixed(2)} | Main Axis: ${comb.main[i].toFixed(2)} | Out of Roundness: ${comb.oor[i].toFixed(4)} | Collapse: ${comb.col[i].toFixed(3)}`;

                    // Perfect 1:1 Sync. Index 'i' corresponds directly to physical coordinate 'i'. No backward jumping.
                    let physIdx = i;

                    if (cleanPathX && cleanPathX[physIdx] !== undefined) {
                        highlightRing.visible = true;
                        
                        const center = new THREE.Vector3(cleanPathX[physIdx], cleanPathY[physIdx], cleanPathZ[physIdx]);

                        let tangent = getSmoothTangent(physIdx, cleanPathX, cleanPathY, cleanPathZ, totalPointsCount);
                        
                        let normalX = new THREE.Vector3(1, 0, 0);
                        let normalY = new THREE.Vector3(0, 1, 0);

                        if (tangent.lengthSq() > 0) {
                            let r_vec = new THREE.Vector3(0, 1, 0);
                            if (Math.abs(tangent.dot(r_vec)) > 0.9) r_vec.set(1, 0, 0);
                            normalX = new THREE.Vector3().crossVectors(tangent, r_vec).normalize();
                            normalY = new THREE.Vector3().crossVectors(tangent, normalX).normalize();
                            
                            const matrix = new THREE.Matrix4();
                            matrix.makeBasis(normalX, normalY, tangent);
                            highlightRing.quaternion.setFromRotationMatrix(matrix);
                        }

                        const baseRadius = window.cross_section_radius || 11.0;
                        
                        let m_val = meshMainAxis[physIdx];
                        if (m_val == null || isNaN(m_val)) m_val = baseRadius * 2;
                        let s_val = meshSecAxis[physIdx];
                        if (s_val == null || isNaN(s_val)) s_val = baseRadius * 2;

                        const trackerRadiusX = s_val / 2.0;
                        const trackerRadiusY = m_val / 2.0;
                        const trackerOffsetX = baseRadius - trackerRadiusX;
                        
                        const adjustedCenter = center.clone().add(normalX.clone().multiplyScalar(trackerOffsetX));
                        
                        highlightRing.position.copy(adjustedCenter);
                        highlightRing.scale.set(trackerRadiusX / baseRadius, trackerRadiusY / baseRadius, 1.0);
                    } else {
                        highlightRing.visible = false;
                    }
                }]
            }
        }, [comb.x, normalize(comb.sec), normalize(comb.main), normalize(comb.oor), normalize(comb.col)], target);
    }

    window.addEventListener('resize', () => {
        const container3d = document.getElementById("viewer3d");
        if (camera && renderer && container3d) {
            camera.aspect = container3d.clientWidth / container3d.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container3d.clientWidth, container3d.clientHeight);
        }
        const containerPlot = document.getElementById("plot");
        if (plotInstance && containerPlot) {
            plotInstance.setSize({ width: containerPlot.clientWidth, height: 500 });
        }
    });

    document.getElementById("goBtn").onclick = () => window.location.href = `geometry.html?prc=${document.getElementById("prcInput").value}`;
    document.getElementById("opacityBtn").onclick = toggleOpacity;
    startAnalysis(currentId);
</script>
</body>
</html>
